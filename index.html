<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ann's Website</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 15px; font-family: Optima, 仿宋, sans-serif; background: #ffffff; color: #333; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 245px; flex-shrink: 0; padding: 30px 22px; border-right: 1px solid #e4dfd8; }
    h1 { font-size: 28px; font-family: Herculanum; margin: 0 0 28px; font-weight: 600; white-space: nowrap; }
    .content { flex: 1; min-width: 0; min-height: 100vh; padding: 40px; background: #ffffff; }
    .welcome-text {text-align: center; color: #333;padding: 50px;}

    .site-avatar {width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 20px;}
    h1 a {color: inherit;text-decoration: none;}
    h1 a:hover {opacity: 0.7;}
    details { margin-bottom: 10px; }
    summary { cursor: pointer; padding: 10px 8px; border-radius: 8px; font-size: 19px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '›'; color: #777; font-size: 25px; transition: transform .2s; }
    details[open] summary { background: #ece7e0; }
    details[open] summary::after { transform: rotate(90deg); }
    .subcategories { display: flex; flex-direction: column; gap: 3px; margin: 5px 0 10px 15px; }
    .subcategories a { display: block; padding: 8px 12px; text-decoration: none; color: #666; border-radius: 7px; }
    .subcategories a:hover, .subcategories a.active { background: #e2eaf0; color: #315f83; }
    main { flex: 1; padding: 52px 48px; }
    main h2 { font-weight: 500; margin: 0 0 12px; }
    main p { color: #777; }
    .card { margin-top: 26px; background: #ffffff; border-radius: 15px; padding: 25px; box-shadow: 0 3px 12px #00000010;
           width: 80%; max-width: 600px; min-height: 150px; height: auto;}
    .card img { width: 200px; height: 200px; object-fit: cover; border-radius: 12px; max-width: 100%; }
    @media (max-width: 600px) { .layout { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e4dfd8; padding: 22px; } h1 { margin-bottom: 16px; } main { padding: 28px 22px; } }
  .archive-card {margin-top: 26px;background: #ffffff;border-radius: 15px;padding: 25px;box-shadow: 0 3px 12px #00000010;width: 80%;max-width: 600px;}
  .archive-card img {width: 100%; height: auto; border-radius: 12px; margin-top: 12px;}
  .archive-card h3 {font-weight: 500;}
  .archive-card p {line-height: 1.8;}
  .archive-entry-body {line-height: 1.8; overflow-wrap: anywhere;}
  .archive-entry-body img {max-width: 100%; height: auto;}
    #archive-editor {
  margin-top: 25px;
  padding: 25px;
  background: #ffffff;
  border-radius: 15px;
  max-width: 600px;}

#archive-editor input[type="text"],
#archive-editor textarea {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: inherit;}

#archive-editor textarea {min-height: 140px;resize: vertical;}

#archive-editor button {
  margin: 10px 8px 0 0;
  padding: 8px 16px;
  cursor: pointer;}

[hidden] { display: none !important;}
    
.editor-toolbar {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.editor-toolbar button {
  min-width: 38px;
  padding: 8px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
}

.rich-editor {
  min-height: 250px;
  padding: 18px;
  margin-top: 10px;
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid #ddd;
  border-radius: 10px;
  line-height: 1.9;
  outline: none;
}

.rich-editor:focus {
  border-color: #527eaa;
}

.rich-editor:empty::before {
  content: attr(data-placeholder);
  color: #aaa;
  pointer-events: none;
}

    
.archive-actions {
  display: flex;
  gap: 10px;
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #e4dfd8;
}

.archive-actions button {
  padding: 8px 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #ffffff;
  font-family: inherit;
  cursor: pointer;
}

.archive-actions button:hover {
  background: #e2eaf0;
}


/* 梦情收藏卡片 */
.dream-toolbar { margin: 22px 0; }
.dream-btn { font: inherit; cursor: pointer; border: 1px solid #d9d2ca; border-radius: 9px; padding: 9px 15px; background: #fffdfb; color: #333; }
.dream-btn:hover { background: #eae5df; }
.dream-form { max-width: 640px; background: #ffffff; padding: 24px; border-radius: 15px; box-shadow: 0 3px 12px #00000010; margin-bottom: 24px; }
.dream-form label { display: block; margin: 14px 0 6px; font-size: 14px; }
.dream-form input, .dream-form select, .dream-form textarea { width: 100%; font: inherit; border: 1px solid #d9d2ca; border-radius: 8px; padding: 10px; background: #fff; }
.dream-form textarea { min-height: 100px; resize: vertical; }
.dream-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dream-fields label { margin-top: 0; }
.dream-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.dream-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 24px; }
.dream-card { background: #ffffff; border-radius: 15px; padding: 18px; box-shadow: 0 3px 12px #00000010; min-width: 0; }
.dream-list .dream-card {width: 100%; max-width: none; min-width: 0; margin-top: 0;}
.dream-list .dream-card img { width: 100%; height: 220px; object-fit: contain;}
.dream-card img { display: block; width: 100%; max-height: 310px; object-fit: contain; background: #f1eeea; border-radius: 10px; margin-bottom: 14px; }
.dream-card h3 { font-weight: 500; margin: 4px 0 10px; overflow-wrap: anywhere; }
.dream-card p { white-space: pre-wrap; line-height: 1.7; overflow-wrap: anywhere; }
.dream-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.dream-status { background: #eee9e2; padding: 5px 10px; border-radius: 20px; font-size: 13px; }
.dream-status.received { background: #e2eee4; }
.dream-note { font-size: 13px; color: #756e66; }
@media (max-width: 600px) { .dream-fields { grid-template-columns: 1fr; } }
@media (max-width: 1000px) {#dream-list {grid-template-columns: repeat(2, minmax(0, 1fr));}}
@media (max-width: 600px) { #dream-list { grid-template-columns: 1fr; }}
    

/* 卡带 / 通贩 / 中古：Excel 风格记录 */
.inventory-toolbar { margin: 22px 0; }
.inventory-wrap { overflow-x: auto; width: 100%; border: 1px solid #dedede; border-radius: 10px; }
.inventory-table { border-collapse: collapse; width: 100%; min-width: 1350px; font-size: 14px; }
.inventory-table th, .inventory-table td { padding: 12px 10px; border-bottom: 1px solid #e9e9e9; text-align: left; vertical-align: middle; }
.inventory-table th { background: #f5f5f5; white-space: nowrap; font-weight: 600; }
.inventory-table tr:last-child td { border-bottom: 0; }
.inventory-table td { overflow-wrap: anywhere; }
.inventory-table .inventory-thumb { width: 70px; height: 70px; object-fit: contain; background: #f6f6f6; border-radius: 6px; }
.inventory-table .inventory-actions { display: flex; gap: 6px; }
.inventory-table .inventory-actions button { white-space: nowrap; }
.inventory-form { border: 1px solid #e2e2e2; background: #ffffff; border-radius: 12px; padding: 22px; margin: 22px 0; max-width: 950px; }
.inventory-form h3 { margin: 0 0 18px; }
.inventory-fields { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 15px; }
.inventory-fields label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.inventory-fields input, .inventory-fields select, .inventory-fields textarea { width: 100%; padding: 10px; border: 1px solid #d8d8d8; border-radius: 7px; font: inherit; background: #fff; }
.inventory-price { display: flex; gap: 7px; }
.inventory-price input { min-width: 0; flex: 1; }
.inventory-price select { width: 95px; }
.inventory-fields .inventory-wide { grid-column: span 3; }
.inventory-preview { max-width: 150px; max-height: 150px; object-fit: contain; margin-top: 8px; }
.inventory-empty { padding: 22px; color: #777; }
@media(max-width: 850px) { .inventory-fields { grid-template-columns: repeat(2,minmax(0,1fr)); } .inventory-fields .inventory-wide { grid-column: span 2; } }
@media(max-width: 600px) { .content { padding: 25px 18px; } .inventory-fields { grid-template-columns: 1fr; } .inventory-fields .inventory-wide { grid-column: span 1; } }

    .inventory-received-cell { text-align: center; min-width: 64px; }
    .inventory-received-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #5d866d; }
    .inventory-received-row { background: #f4f9f5; }

    /* Editorial homepage: white, Garamond, local clock, subtle fade */
    body { margin: 0; }
    .sidebar { border-right: 1px solid #ebebeb; }
    body.home-view #page-title, body.home-view #page-description { display: none; }
    body.home-view .content { padding: 0; background: #fff; }
    body.home-view .site-avatar { display: none; }
    body.home-view .sidebar { padding: 42px 25px 35px 35px; }
    body.home-view .sidebar h1 { font-family: Garamond, 'EB Garamond', Georgia, serif; font-size: 27px; font-weight: 400; margin-bottom: 45px; }
    body.home-view .sidebar h1::after { content: 'PERSONAL ARCHIVE'; display: block; margin-top: 9px; font: 10px Optima, Arial, sans-serif; letter-spacing: .28em; color: #888; }
    body.home-view .sidebar summary { font: 11px Optima, Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #666; padding: 16px 0; }
    body.home-view .sidebar details[open] summary { background: transparent; }
    body.home-view .sidebar .subcategories a { font-size: 15px; padding: 9px 12px; }
    body.home-view .sidebar .subcategories a.active, body.home-view .sidebar .subcategories a:hover { background: #f5f5f5; color: #222; }
    .home-hero { position: relative; width: 100%; min-height: 100vh; background: #fff; overflow: hidden; }
    .home-top-nav { position: absolute; left: 4%; top: 56px; display: flex; flex-wrap: wrap; gap: clamp(14px, 3vw, 45px); }
    .home-top-nav a { color: #555; text-decoration: none; font: 10px Optima, Arial, sans-serif; letter-spacing: .25em; }
    .home-top-nav a:hover { color: #111; text-decoration: underline; text-underline-offset: 6px; }
    .home-clock { position: absolute; top: 35px; right: 3.5%; padding-left: 24px; border-left: 1px solid #bbb; text-align: right; color: #444; font-family: Garamond, Georgia, serif; }
    .home-clock-time { display: block; font-size: 24px; letter-spacing: .055em; font-variant-numeric: tabular-nums; }
    .home-clock-date { display: block; margin-top: 7px; font: 11px Optima, Arial, sans-serif; letter-spacing: .12em; }
    .home-clock-caption { display: block; margin-top: 8px; font: 10px Optima, Arial, sans-serif; letter-spacing: .19em; color: #888; }
    .home-quote-block { position: absolute; right: 3.5%; bottom: 8%; max-width: 94%; text-align: right; }
    .home-hero-quote { margin: 0; color: #191919; font-family: Garamond, 'EB Garamond', 'Adobe Garamond Pro', Georgia, serif; font-weight: 400; font-size: clamp(64px, 7.6vw, 128px); line-height: .99; letter-spacing: -.055em; }
    .home-hero-quote span { display: block; }
    .home-hero-translation { margin: 25px 0 0; color: #999; font-family: 'STXinwei', '华文新魏', 'STKaiti', 'KaiTi', serif; font-size: clamp(13px, 1.2vw, 18px); font-weight: 400; font-style: italic; letter-spacing: .14em; }
    .home-hero-translation::before { content: ''; display: inline-block; width: 36px; margin-right: 20px; border-top: 1px solid #aaa; vertical-align: middle; }
    @keyframes homeFadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes homeFade { from { opacity: 0; } to { opacity: 1; } }
    body.home-view .home-hero-quote span { opacity: 0; animation: homeFadeUp 1.4s cubic-bezier(.22,1,.36,1) forwards; }
    body.home-view .home-hero-quote span:first-child { animation-delay: .35s; }
    body.home-view .home-hero-quote span:last-child { animation-delay: 1s; }
    body.home-view .home-hero-translation { opacity: 0; animation: homeFade 1.2s ease 1.8s forwards; }
    @media (max-width: 950px) { .home-top-nav { top: 32px; } .home-clock { top: 90px; } .home-hero-quote { font-size: clamp(52px, 8vw, 90px); } }
    @media (max-width: 600px) { body.home-view .sidebar { padding: 20px 22px; } body.home-view .sidebar h1 { margin-bottom: 12px; } .home-hero { min-height: 68vh; } .home-top-nav { top: 20px; left: 5%; gap: 16px; } .home-top-nav a { font-size: 9px; } .home-clock { top: 70px; right: 5%; } .home-clock-time { font-size: 20px; } .home-quote-block { right: 5%; bottom: 12%; } .home-hero-quote { font-size: clamp(39px, 9vw, 65px); } .home-hero-translation { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) { body.home-view .home-hero-quote span, body.home-view .home-hero-translation { opacity: 1; animation: none; transform: none; } }


    /* Shared editorial design across home and all collection/archive pages */
    body { margin: 0; background: #fff; color: #242424; }
    .layout { min-height: 100vh; }
    .sidebar { width: 252px; padding: 42px 25px 35px 35px; border-right: 1px solid #ebebeb; background: #fff; }
    .site-avatar { display: none; }
    .sidebar h1, body.home-view .sidebar h1 {
      font-family: Garamond, 'EB Garamond', Georgia, serif;
      font-size: 27px; font-weight: 400; margin: 0 0 45px; white-space: nowrap;
    }
    .sidebar h1::after, body.home-view .sidebar h1::after {
      content: 'PERSONAL ARCHIVE'; display: block; margin-top: 9px;
      font: 10px Optima, Arial, sans-serif; letter-spacing: .28em; color: #888;
    }
    .sidebar details { margin: 0 0 24px; }
    .sidebar summary, body.home-view .sidebar summary {
      font: 11px Optima, Arial, sans-serif; letter-spacing: .16em;
      text-transform: uppercase; color: #666; padding: 16px 0;
      border-radius: 0; background: transparent;
    }
    .sidebar details[open] summary, body.home-view .sidebar details[open] summary { background: transparent; }
    .sidebar summary::after { font-size: 17px; color: #aaa; }

    .content { padding: 52px clamp(24px, 4.5vw, 72px); background: #fff; }

  <script>
    const title = document.getElementById('page-title');
    const description = document.getElementById('page-description');
    const welcome = document.getElementById('welcome-card');
    const archiveContent = document.getElementById('archive-content');
    const archiveList = document.getElementById('archive-list');
    const links = document.querySelectorAll('[data-category]');
    const richEditor = document.getElementById('archive-description');
    const boldBtn = document.getElementById('bold-btn');
    const italicBtn = document.getElementById('italic-btn');
    const headingBtn = document.getElementById('heading-btn');
    const paragraphBtn = document.getElementById('paragraph-btn');
    const insertImageBtn = document.getElementById('insert-image-btn');
    const inlineImageInput = document.getElementById('inline-image-input');
    const addArchiveBtn = document.getElementById('add-archive-btn');
    const archiveEditor = document.getElementById('archive-editor');
    const archiveTitleInput = document.getElementById('archive-title');
    const archiveCancelBtn = document.getElementById('archive-cancel-btn');
    const archiveSaveBtn = document.getElementById('archive-save-btn');
    
    const inventoryCategories = ['卡带', '通贩', '中古'];
    
    // GitHub 登录：连接 Cloudflare Worker
    const archiveApi =
      'https://curly-wind-151eanns-website-api.ann657299.workers.dev';

    const archiveLoginBtn =
      document.getElementById('archive-login');
    const archiveLogoutBtn =
      document.getElementById('archive-logout');
    const archiveAuthStatus =
      document.getElementById('archive-auth-status');

    let archiveSession =
      sessionStorage.getItem('ann_archive_session') || '';
    let archiveAuthenticated = false;

    function updateArchiveLoginUI() {
      archiveLoginBtn.hidden = archiveAuthenticated;
      archiveLogoutBtn.hidden = !archiveAuthenticated;
      addArchiveBtn.hidden = !archiveAuthenticated;

      archiveAuthStatus.textContent = archiveAuthenticated
        ? '已登录：可以编辑'
        : '访客模式：仅浏览';

      document.querySelectorAll('.archive-actions')
        .forEach(el => {
          el.hidden = !archiveAuthenticated;
        });
    }

    archiveLoginBtn.addEventListener('click', () => {
      window.location.href = archiveApi + '/login';
    });

    archiveLogoutBtn.addEventListener('click', async () => {
      try {
        await fetch(archiveApi + '/logout', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + archiveSession
          }
        });
      } catch (error) {
        console.error(error);
      }

      archiveSession = '';
      archiveAuthenticated = false;
      sessionStorage.removeItem('ann_archive_session');
      updateArchiveLoginUI();
    });

    async function initializeArchiveLogin() {
      const match =
        /^#ann-login=([a-f0-9]{64})$/.exec(location.hash);

      if (match) {
        history.replaceState(
          null,
          '',
          location.pathname + location.search + '#2026'
        );

        try {
          const response = await fetch(archiveApi + '/exchange', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              ticket: match[1]
            })
          });

          if (!response.ok) {
            throw new Error('登录凭证交换失败');
          }

          const data = await response.json();
          archiveSession = data.session;
          sessionStorage.setItem(
            'ann_archive_session',
            archiveSession
          );
        } catch (error) {
          console.error(error);
          alert('GitHub 登录失败，请重试。');
        }
      }

      if (archiveSession) {
        try {
          const response = await fetch(archiveApi + '/me', {
            headers: {
              Authorization: 'Bearer ' + archiveSession
            }
          });

          if (response.ok) {
            const data = await response.json();
            archiveAuthenticated =
              data.authenticated === true;
          }
        } catch (error) {
          console.error(error);
        }
      }

      if (!archiveAuthenticated) {
        archiveSession = '';
        sessionStorage.removeItem('ann_archive_session');
      }

      updateArchiveLoginUI();
    }

    initializeArchiveLogin();

    const archiveYears = ['2026', '2025', '2024', '2023', '2022'];
    function updatePage() {
      const category = decodeURIComponent(location.hash.slice(1));
      const match = [...links].find(link => link.dataset.category === category);
      links.forEach(link => link.classList.toggle('active', link === match));
      if (match) match.closest('details').open = true;
      welcome.hidden = Boolean(match);
      document.body.classList.toggle('home-view', !match);
      document.body.classList.toggle('collection-view', category === '梦情' || inventoryCategories.includes(category));
      archiveContent.hidden = !archiveYears.includes(category);
      document.getElementById('dream-content').hidden = category !== '梦情';
      document.getElementById('inventory-content').hidden = !inventoryCategories.includes(category);
      if (category === '梦情') renderDreamCards();
      if (inventoryCategories.includes(category)) {
        inventoryForm.hidden = true;
        renderInventory(category);
      }
      if (archiveYears.includes(category)) {
        title.textContent = category;
        description.textContent = 'The Wandering Archive · ' + category;
        loadArchive(category);
      } else if (match) {
        title.textContent = category;
        description.textContent = inventoryCategories.includes(category) ? '' : '这里可以添加分类 ' + category + ' 的内容。';
      } else {
        title.textContent = '我的购物记录';
        description.textContent = '记录我买过的好东西。点击左侧分类查看内容。';
      }
    }
  // 旅行记录按年份存储在当前浏览器。已有 JSON 文件作为初始记录读取。
  const archiveStoragePrefix = 'anns-website-archive-records-v1-';
  let archiveRecords = [];
  let editingArchiveId = null;
  let activeArchiveYear = null;
  let archiveLoadSequence = 0;
  const archiveImagesInput = document.getElementById('archive-images');

  function archiveStorageKey(year) { return archiveStoragePrefix + year; }
  function readStoredArchive(year) {
    try {
      const raw = localStorage.getItem(archiveStorageKey(year));
      if (raw === null) return null;
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : null;
    } catch (error) { console.error('读取旅行记录失败', error); return null; }
  }
  function persistArchive(year, records) {
    try {
      localStorage.setItem(archiveStorageKey(year), JSON.stringify(records));
      return true;
    } catch (error) {
      console.error('保存旅行记录失败', error);
      alert('保存失败：浏览器存储空间可能不足。请缩小图片后再试。');
      return false;
    }
  }
  function archiveId() {
    return 'trip-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }
  function normalizeArchive(record) {
    return {
      id: record.id || archiveId(),
      title: record.title || '',
      description: record.description || '',
      html: record.html || '',
      images: Array.isArray(record.images) ? record.images : []
    };
  }
  function closeArchiveEditor() {
    archiveEditor.hidden = true;
    editingArchiveId = null;
    savedRange = null;
    archiveImagesInput.value = '';
    inlineImageInput.value = '';
  }
  function openArchiveEditor(record = null) {
    if (!archiveAuthenticated) return;
    editingArchiveId = record ? record.id : null;
    archiveTitleInput.value = record ? record.title : '';
    richEditor.innerHTML = record ? (record.html || escapeArchiveHtml(record.description).replace(/\n/g, '<br>')) : '';
    archiveImagesInput.value = '';
    savedRange = null;
    archiveEditor.hidden = false;
    archiveTitleInput.focus();
  }
  function escapeArchiveHtml(value) {
    const node = document.createElement('div');
    node.textContent = value || '';
    return node.innerHTML;
  }
  function renderArchive(year) {
    archiveList.replaceChildren();
    if (!archiveRecords.length) {
      archiveList.textContent = year + ' 年还没有旅行记录。';
      return;
    }
    archiveRecords.forEach(record => {
      const card = document.createElement('div');
      card.className = 'archive-card';
      const heading = document.createElement('h3');
      heading.textContent = record.title || '未命名旅行';
      card.appendChild(heading);
      const body = document.createElement('div');
      body.className = 'archive-entry-body';
      if (record.body) {
        body.textContent = record.body;
        body.style.whiteSpace = 'pre-wrap';
      } else if (record.html) {
        // 只展示自己在本地编辑器中保存的内容，移除潜在的脚本与事件属性。
        const template = document.createElement('template');
        template.innerHTML = record.html;
        template.content.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(n => n.remove());
        template.content.querySelectorAll('*').forEach(el => {
          for (const attr of [...el.attributes]) {
            if (/^on/i.test(attr.name) || ((attr.name === 'src' || attr.name === 'href') && /^\s*javascript:/i.test(attr.value))) el.removeAttribute(attr.name);
          }
        });
        body.appendChild(template.content);
      } else {
        body.textContent = record.description || '';
        body.style.whiteSpace = 'pre-wrap';
      }
      card.appendChild(body);
      (record.images || []).forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = record.title || '旅行照片';
        img.loading = 'lazy';
        img.style.cursor = 'zoom-in';
        const link = document.createElement('a');
        link.href = src;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = '打开原图，可在新页面保存';
        link.appendChild(img);
        card.appendChild(link);
      });
      const actions = document.createElement('div');
      actions.className = 'archive-actions';
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.textContent = '编辑';
      editBtn.addEventListener('click', () => openArchiveEditor(record));
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.textContent = '删除';
     
      deleteBtn.addEventListener('click', async () => {
        if (!archiveAuthenticated) {
          alert('请先使用 GitHub 登录');
          return;
        }

        if (!confirm('确定删除这条旅行记录并发布到 GitHub 吗？')) {
          return;
        }

        const next = archiveRecords.filter(
          item => item.id !== record.id
        );

        deleteBtn.disabled = true;
        deleteBtn.textContent = '正在删除...';

        try {
          await publishArchive(year, next);

          archiveRecords = next;

          if (editingArchiveId === record.id) {
            closeArchiveEditor();
          }

          renderArchive(year);

          alert('旅行记录已从 GitHub 删除。');
        } catch (error) {
          console.error(error);
          alert('删除失败：' + error.message);

          deleteBtn.disabled = false;
          deleteBtn.textContent = '删除';
        }
      });

      actions.append(editBtn, deleteBtn);

      // 只有登录的管理员才能看到编辑和删除按钮
      actions.hidden = !archiveAuthenticated;

      card.appendChild(actions);
      archiveList.appendChild(card);
    });
  }
  async function loadArchive(year = '2026') {
    activeArchiveYear = year;
    closeArchiveEditor();
    const sequence = ++archiveLoadSequence;
    archiveList.textContent = '正在加载旅行记录...';
    try {
      const response = await fetch('data/public-archive-' + year + '.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('无法读取旅行数据');
      const data = await response.json();
      if (sequence !== archiveLoadSequence) return;
      archiveRecords = (Array.isArray(data.entries) ? data.entries : []).map(normalizeArchive);
    } catch (error) {
      if (sequence !== archiveLoadSequence) return;
      console.info('未找到旅行记录文件，将使用空白记录', error);
      archiveRecords = [];
    }
    renderArchive(year);
  }
  
  // 向 Cloudflare Worker 发送经过身份验证的请求
  async function archiveRequest(path, options = {}) {
    if (!archiveAuthenticated || !archiveSession) {
      throw new Error('请先登录 GitHub');
    }

    const response = await fetch(archiveApi + path, {
      ...options,
      headers: {
        ...(options.headers || {}),
        Authorization: 'Bearer ' + archiveSession
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || '请求失败');
    }

    return data;
  }

  // 上传单张照片到 GitHub
  async function uploadArchiveImage(file) {
    if (file.size > 4 * 1024 * 1024) {
      throw new Error(
        '照片超过 4 MB，请先压缩：' + file.name
      );
    }

    const result = await archiveRequest('/upload', {
      method: 'POST',
      headers: {
        'Content-Type': file.type
      },
      body: file
    });

    return result.path;
  }

  // 上传插入在日记正文中的照片
  async function persistInlineImages() {
    const imgs = [...richEditor.querySelectorAll('img')];

    for (const img of imgs) {
      const src = img.getAttribute('src') || '';

      if (
        !src.startsWith('blob:') &&
        !src.startsWith('data:image/')
      ) {
        continue;
      }

      const response = await fetch(src);
      const blob = await response.blob();

      const type = blob.type || 'image/png';
      const file = new File(
        [blob],
        'inline-image',
        { type }
      );

      const path = await uploadArchiveImage(file);
      img.setAttribute('src', path);

      if (src.startsWith('blob:')) {
        URL.revokeObjectURL(src);
      }
    }
  }

  // 将某一年的旅行记录发布到 GitHub
  async function publishArchive(year, records) {
    return archiveRequest('/publish', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        year,
        entries: records
      })
    });
  }

    function formatText(command, value = null) {richEditor.focus();document.execCommand(command, false, value);}
    boldBtn.addEventListener('click', () => {formatText('bold');});
    italicBtn.addEventListener('click', () => {formatText('italic');});
    headingBtn.addEventListener('click', () => { formatText('formatBlock', 'h2');});
    paragraphBtn.addEventListener('click', () => {formatText('formatBlock', 'p');});
    
let savedRange = null;

// 记住编辑器中光标的位置
richEditor.addEventListener('keyup', saveCursor);
richEditor.addEventListener('mouseup', saveCursor);

function saveCursor() {
  const selection = window.getSelection();

  if (selection.rangeCount > 0 &&
      richEditor.contains(selection.anchorNode)) {
    savedRange = selection.getRangeAt(0).cloneRange();

  img.style.height = 'auto';
  img.style.display = 'block';
  img.style.margin = '20px 0';

  richEditor.focus();

  const selection = window.getSelection();
  const range = savedRange && richEditor.contains(savedRange.commonAncestorContainer)
    ? savedRange
    : document.createRange();

  if (!savedRange || !richEditor.contains(savedRange.commonAncestorContainer)) {
    range.selectNodeContents(richEditor);
    range.collapse(false);
  }

  range.deleteContents();
  range.insertNode(img);
  range.setStartAfter(img);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);

  savedRange = range.cloneRange();
  inlineImageInput.value = '';
});

// 梦情收藏：仅存储于当前浏览器（localStorage），不是 GitHub 云端保存
const dreamKey = 'anns-website-dream-records-v1';
const dreamForm = document.getElementById('dream-form');
const dreamList = document.getElementById('dream-list');
const dreamImage = document.getElementById('dream-image');
const dreamPreview = document.getElementById('dream-preview');
let dreamEditingId = null;
let dreamImageData = '';
function readDreamRecords() {
  try {
    const data = JSON.parse(localStorage.getItem(dreamKey) || '[]');
    return Array.isArray(data) ? data : [];
  } catch (error) { console.error(error); return []; }
}
function saveDreamRecords(records) {
  try { localStorage.setItem(dreamKey, JSON.stringify(records)); return true; }
  catch (error) { alert('保存失败：浏览器存储空间不足。请尝试使用更小的图片，或先备份并清理旧记录。'); console.error(error); return false; }
}
function openDreamForm(record = null) {
  dreamForm.reset();
  dreamEditingId = record ? record.id : null;
  dreamImageData = record ? (record.image || '') : '';
  document.getElementById('dream-form-heading').textContent = record ? '编辑收藏记录' : '新增收藏记录';
  document.getElementById('dream-name').value = record ? record.name : '';
  document.getElementById('dream-description').value = record ? record.description : '';
  document.getElementById('dream-status').value = record ? record.status : '未收到';
  document.getElementById('dream-amount').value = record ? record.amount : '';
  document.getElementById('dream-currency').value = record ? record.currency : 'JPY';
  document.getElementById('dream-target-price').value = record ? String(record.targetPrice ?? record.idealPrice ?? '') : '';
  document.getElementById('dream-target-currency').value = record ? (record.targetCurrency || record.idealCurrency || record.currency || 'JPY') : 'JPY';
  dreamPreview.hidden = !dreamImageData;
  if (dreamImageData) dreamPreview.src = dreamImageData;
  else dreamPreview.removeAttribute('src');
  dreamForm.hidden = false;
  document.getElementById('dream-name').focus();
}
document.getElementById('dream-add').addEventListener('click', () => openDreamForm());
document.getElementById('dream-cancel').addEventListener('click', () => { dreamForm.hidden = true; });
dreamImage.addEventListener('change', async () => {
  const file = dreamImage.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  if (file.size > 15 * 1024 * 1024) { alert('图片过大，请选择小于 15MB 的图片'); return; }
  try {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const image = new Image();
    await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = dataUrl; });
    const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    dreamImageData = canvas.toDataURL('image/jpeg', 0.75);
    dreamPreview.src = dreamImageData;
    dreamPreview.hidden = false;
  } catch (error) { console.error(error); alert('图片处理失败，请尝试其他图片'); }
});
dreamForm.addEventListener('submit', (event) => {
  event.preventDefault();
  const name = document.getElementById('dream-name').value.trim();
  const amount = document.getElementById('dream-amount').value;
  if (amount !== '' && (!Number.isFinite(Number(amount)) || Number(amount) < 0)) {
    alert('金额请输入有效的非负数字，或留空'); return;
  }
  const records = readDreamRecords();
  const record = {
    id: dreamEditingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random()),
    name,
    description: document.getElementById('dream-description').value.trim(),
    status: document.getElementById('dream-status').value,
    amount: amount === '' ? '' : Number(amount),
    currency: document.getElementById('dream-currency').value,
    targetPrice: document.getElementById('dream-target-price').value.trim(),
    targetCurrency: document.getElementById('dream-target-currency').value,
    image: dreamImageData
  };
  const existingIndex = records.findIndex(item => item.id === dreamEditingId);
  if (existingIndex >= 0) records[existingIndex] = record;
  else records.unshift(record);
  if (!saveDreamRecords(records)) return;
  dreamForm.hidden = true;
  renderDreamCards();
});
function renderDreamCards() {
  dreamList.replaceChildren();
  const records = readDreamRecords();
  if (!records.length) {
    const empty = document.createElement('p');
    empty.textContent = '还没有收藏记录，点击上方按钮添加第一件吧。';
    dreamList.appendChild(empty);
    return;
  }
  records.forEach(record => {
    const card = document.createElement('article'); card.className = 'dream-card';
    if (record.image) {
      const img = document.createElement('img'); img.src = record.image; img.alt = record.name || '收藏品图片'; card.appendChild(img);
    }
    const heading = document.createElement('h3'); heading.textContent = record.name; card.appendChild(heading);
    if (record.description) { const p = document.createElement('p'); p.textContent = record.description; card.appendChild(p); }
    const meta = document.createElement('div'); meta.className = 'dream-meta';
    const status = document.createElement('span'); status.className = 'dream-status' + (record.status === '收到' ? ' received' : ''); status.textContent = record.status === '收到' ? '已收到' : '未收到';
    meta.appendChild(status);
    // 未收到时不显示购买金额；已收到但金额未填写时也不显示占位提示。
    if (record.status === '收到' && record.amount !== '' && record.amount != null && Number.isFinite(Number(record.amount))) {
      const amount = document.createElement('strong');
      const currency = record.currency === 'CNY' ? 'CNY' : 'JPY';
      amount.textContent = '¥' + Number(record.amount).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' ' + currency;
      meta.appendChild(amount);
    }
    card.appendChild(meta);
    const targetPrice = record.targetPrice ?? record.idealPrice;
    if (targetPrice !== undefined && targetPrice !== null && String(targetPrice).trim() !== '') {
      const target = document.createElement('p'); target.className = 'dream-note';
      target.textContent = '心理价：' + String(targetPrice) + ' ' + (record.targetCurrency || record.idealCurrency || record.currency || 'JPY');
      card.appendChild(target);
    }
    const actions = document.createElement('div'); actions.className = 'dream-actions';
    const edit = document.createElement('button'); edit.className = 'dream-btn'; edit.type = 'button'; edit.textContent = '编辑'; edit.addEventListener('click', () => openDreamForm(record));
    const remove = document.createElement('button'); remove.className = 'dream-btn'; remove.type = 'button'; remove.textContent = '删除';
    remove.addEventListener('click', () => {
      if (!confirm('确定删除「' + record.name + '」吗？此操作会删除当前浏览器中的记录。')) return;
      const next = readDreamRecords().filter(item => item.id !== record.id);
      if (saveDreamRecords(next)) { dreamForm.hidden = true; renderDreamCards(); }
    });
    actions.append(edit, remove); card.appendChild(actions); dreamList.appendChild(card);
  });
}

function openInventoryForm(record = null) {

  inventoryFields.forEach(field => {
    const control = inventoryForm.elements.namedItem(field);
    if (control && record && record[field] !== undefined && record[field] !== null) control.value = String(record[field]);
  });

  if (inventoryImageData) inventoryPreview.src = inventoryImageData;

inventoryImage.addEventListener('change', async () => {
  const file = inventoryImage.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
  if (file.size > 15 * 1024 * 1024) { alert('图片过大，请选择小于 15MB 的图片'); return; }
  try {
    const url = await new Promise((resolve,reject) => {
      const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file);
    });
    const image = new Image();
    await new Promise((resolve,reject) => { image.onload = resolve; image.onerror = reject; image.src = url; });
    const scale = Math.min(1, 850 / Math.max(image.width,image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(image.width*scale));
    canvas.height = Math.max(1,Math.round(image.height*scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff'; context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    inventoryImageData = canvas.toDataURL('image/jpeg',0.68);
    inventoryPreview.src = inventoryImageData;
    inventoryPreview.hidden = false;
  } catch(error) { console.error(error); alert('图片处理失败，请换一张图片'); }
});

function renderInventory(category) {

    const tr = document.createElement('tr'); const td = document.createElement('td');

    checkbox.type = 'checkbox';

      const records = readInventory(category);
      const target = records.find(item => item.id === record.id);
      if (!target) { checkbox.checked = !checkbox.checked; return; }
      target.received = checkbox.checked;
      if (!saveInventory(category, records)) { checkbox.checked = !checkbox.checked; return; }
      record.received = checkbox.checked;
      tr.classList.toggle('inventory-received-row', checkbox.checked);

    function formatCoordinates(latitude, longitude) {
      return Math.abs(latitude).toFixed(4) + '° ' + (latitude >= 0 ? 'N' : 'S') +
        ' · ' + Math.abs(longitude).toFixed(4) + '° ' + (longitude >= 0 ? 'E' : 'W');
    }
    function showLocationResult(data, saved = false) {
      if (!cityLabel || !coordinateLabel) return;
      cityLabel.textContent = (data.city || 'City unavailable') + (saved ? ' · saved' : '');
      coordinateLabel.textContent = formatCoordinates(data.latitude, data.longitude);
      cityLabel.title = saved ? '上次授权定位的结果，点击刷新图标更新' : '浏览器授权定位结果';
    }
    function readCachedLocation() {
      try {
        const data = JSON.parse(localStorage.getItem(locationCacheKey) || 'null');
        return data && Number.isFinite(data.latitude) && Number.isFinite(data.longitude) ? data : null;
      } catch (_) { return null; }
    }
    const cachedLocation = readCachedLocation();
    if (cachedLocation) showLocationResult(cachedLocation, true);
    else if (cityLabel) cityLabel.textContent = 'Location not set';
    if (coordinateLabel && !cachedLocation) coordinateLabel.textContent = '';
    async function reverseGeocode(latitude, longitude) {
      // OpenStreetMap Nominatim: coordinates are shared only after geolocation consent.
      const url = new URL('https://nominatim.openstreetmap.org/reverse');
      url.searchParams.set('format', 'jsonv2');
      url.searchParams.set('lat', String(latitude));
      url.searchParams.set('lon', String(longitude));
      url.searchParams.set('zoom', '10');
      url.searchParams.set('addressdetails', '1');
      url.searchParams.set('accept-language', 'en');
      const response = await fetch(url.toString(), {headers: {'Accept': 'application/json'}});
      if (!response.ok) throw new Error('Reverse geocoding unavailable');
      const result = await response.json();
      const address = result.address || {};
      const city = address.city || address.town || address.village || address.municipality ||
        address.county || address.state || '';
      const country = address.country || '';
      return [city, country].filter(Boolean).join(', ');
    }
    let locating = false;
    function updateVisitorLocation() {
      if (!cityLabel || !coordinateLabel || locating) return;
      if (!navigator.geolocation) {
        if (!cachedLocation) cityLabel.textContent = 'Location unavailable';
        return;
      }
      locating = true;
      if (locationButton) locationButton.disabled = true;
      if (!readCachedLocation()) cityLabel.textContent = 'Waiting for permission…';
      navigator.geolocation.getCurrentPosition(async position => {
        const {latitude, longitude, accuracy} = position.coords;
        // A very broad position can be misleading at the city level.
        if (accuracy > 20000) {
          cityLabel.textContent = 'Location not precise enough';
          coordinateLabel.textContent = 'Please check device location settings';
          locating = false;
          if (locationButton) locationButton.disabled = false;
          return;
        }
        const data = {latitude, longitude, city: 'Finding city…', savedAt: Date.now()};
        showLocationResult(data);
        try {
          data.city = await reverseGeocode(latitude, longitude) || 'City unavailable';
        } catch (error) {
          data.city = 'City unavailable';
          console.warn('City lookup unavailable:', error);
        }
        showLocationResult(data);
        try { localStorage.setItem(locationCacheKey, JSON.stringify(data)); } catch (_) {}
        locating = false;
        if (locationButton) locationButton.disabled = false;
      }, error => {
        if (!readCachedLocation()) {
          cityLabel.textContent = error.code === 1 ? 'Location permission needed' : 'Location unavailable';
          coordinateLabel.textContent = '';
        }
        locating = false;
        if (locationButton) locationButton.disabled = false;
      }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
    }
    if (locationButton) locationButton.addEventListener('click', updateVisitorLocation);
    // Ask on first load. Permission prompts are controlled by the browser.
    updateVisitorLocation();
    window.addEventListener('hashchange', updatePage);
    updatePage();
  </script>
</body>
</html>
