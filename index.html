<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ann's Website</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 15px; font-family: Optima, 仿宋, sans-serif; background: #f7f5f2; color: #333; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 245px; flex-shrink: 0; padding: 30px 22px; border-right: 1px solid #e4dfd8; }
    h1 { font-size: 28px; font-family: Herculanum; margin: 0 0 28px; font-weight: 600; white-space: nowrap; }
    .content {flex: 1; min-width: 0; min-height: 100vh; padding: 40px; background-image: linear-gradient(
      rgba(247, 245, 242, 0.4),
      rgba(247, 245, 242, 0.4)), url("images/background.jpg");
              
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;}
    .welcome-text {text-align: center; color: #333;padding: 50px;}

    .site-avatar {width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 20px;}
    h1 a {color: inherit;text-decoration: none;}
    h1 a:hover {opacity: 0.7;}
    details { margin-bottom: 10px; }
    summary { cursor: pointer; padding: 10px 8px; border-radius: 8px; font-size: 19px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '›'; color: #777; font-size: 25px; transition: transform .2s; }
    details[open] summary { background: #ece7e0; }
    details[open] summary::after { transform: rotate(90deg); }
    .subcategories { display: flex; flex-direction: column; gap: 3px; margin: 5px 0 10px 15px; }
    .subcategories a { display: block; padding: 8px 12px; text-decoration: none; color: #666; border-radius: 7px; }
    .subcategories a:hover, .subcategories a.active { background: #e2eaf0; color: #315f83; }
    main { flex: 1; padding: 52px 48px; }
    main h2 { font-weight: 500; margin: 0 0 12px; }
    main p { color: #777; }
    .card { margin-top: 26px; background: rgba(255, 255, 255, 0.5); border-radius: 15px; padding: 25px; box-shadow: 0 3px 12px #00000010;
           width: 80%; max-width: 600px; min-height: 150px; height: auto;}
    .card img { width: 200px; height: 200px; object-fit: cover; border-radius: 12px; max-width: 100%; }
    @media (max-width: 600px) { .layout { flex-direction: column; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e4dfd8; padding: 22px; } h1 { margin-bottom: 16px; } main { padding: 28px 22px; } }
  .archive-card {margin-top: 26px;background: rgba(255, 255, 255, 0.5);border-radius: 15px;padding: 25px;box-shadow: 0 3px 12px #00000010;width: 80%;max-width: 600px;}
  .archive-card img {width: 100%; height: auto; border-radius: 12px; margin-top: 12px;}
  .archive-card h3 {font-weight: 500;}
  .archive-card p {line-height: 1.8;}
    #archive-editor {
  margin-top: 25px;
  padding: 25px;
  background: rgba(255,255,255,0.7);
  border-radius: 15px;
  max-width: 600px;}

#archive-editor input[type="text"],
#archive-editor textarea {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: inherit;}

#archive-editor textarea {min-height: 140px;resize: vertical;}

#archive-editor button {
  margin: 10px 8px 0 0;
  padding: 8px 16px;
  cursor: pointer;}

[hidden] {
  display: none !important;}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <img src="images/avatar.jpg" class="site-avatar" alt="网站头像">
      <h1>
  <a href="index.html">Ann’s Website</a>
</h1>
      <nav aria-label="商品分类">
        <details>
          <summary>Gate of Babylon</summary>
          <div class="subcategories">
            <a href="#卡带" data-category="卡带">卡带</a>
            <a href="#通贩" data-category="通贩">通贩</a>
            <a href="#梦情" data-category="梦情">梦情</a>
            <a href="#中古" data-category="中古">中古</a>
          
          </div>
        </details>
        <details>
          <summary>The Wandering Archive</summary>
          <div class="subcategories">
            <a href="#2026" data-category="2026">2026</a>
            <a href="#B2" data-category="B2">2</a>
            <a href="#B3" data-category="B3">3</a>
            <a href="#B4" data-category="B4">4</a>
            <a href="#B5" data-category="B5">5</a>
          </div>
        </details>
        <details>
          <summary>C</summary>
          <div class="subcategories">
            <a href="#C1" data-category="C1">1</a>
            <a href="#C2" data-category="C2">2</a>
            <a href="#C3" data-category="C3">3</a>
            <a href="#C4" data-category="C4">4</a>
            <a href="#C5" data-category="C5">5</a>
          </div>
        </details>
      </nav>
    </aside>
    <main class="content">
      <h2 id="page-title">我的购物记录</h2>
      <p id="page-description">记录我买过的好东西。点击左侧分类查看内容。</p>
      <div class="card" id="welcome-card">
        <img src="images/WechatIMG294.jpg" alt="WJ50周年展 缶バッジ 六道骸">
        <p>我的收藏</p>
      </div>
      
      <div id="archive-content" hidden>
  <div id="archive-list"></div>

  <button id="add-archive-btn" type="button" hidden>
    + 添加旅行记录
  </button>

  <div id="archive-editor" hidden>
    <h3>编辑旅行记录</h3>

    <input id="archive-title" type="text" placeholder="旅行标题">

    <textarea id="archive-description"
      placeholder="写下你的旅行故事"></textarea>

    <input id="archive-images" type="file" accept="image/*" multiple>

    <button id="archive-save-btn" type="button">保存</button>
    <button id="archive-cancel-btn" type="button">取消</button>
  </div>
</div>
    </main>
  </div>
  <script>
    const title = document.getElementById('page-title');
    const description = document.getElementById('page-description');
    const welcome = document.getElementById('welcome-card');
    const archiveContent = document.getElementById('archive-content');
    const archiveList = document.getElementById('archive-list');
    const links = document.querySelectorAll('[data-category]');
    function updatePage() {
  const category = decodeURIComponent(location.hash.slice(1));
  const match = [...links].find(link => link.dataset.category === category);
  links.forEach(link => {
    link.classList.toggle('active', link === match);});
  if (match) {match.closest('details').open = true;}
  welcome.hidden = Boolean(match);
  archiveContent.hidden = category !== '2026';

  if (category === '2026') {title.textContent = '2026';description.textContent = 'The Wandering Archive · 2026';loadArchive();} 
  else if (match) {title.textContent = category;description.textContent = '这里可以添加分类 ' + category + ' 的内容。';} else {title.textContent = '我的购物记录';description.textContent = '记录我买过的好东西。点击左侧分类查看内容。';}}
  async function loadArchive() { archiveList.textContent = '正在加载旅行记录...';
  try { const response = await fetch('data/archive-2026.json');
    if (!response.ok) {throw new Error('无法读取旅行数据');}
    const records = await response.json();
    archiveList.innerHTML = '';
    records.forEach(record => {
      const card = document.createElement('div');
      card.className = 'archive-card';
      const heading = document.createElement('h3');
      heading.textContent = record.title;
      card.appendChild(heading);
      const paragraph = document.createElement('p');
      paragraph.textContent = record.description;
      card.appendChild(paragraph);
      (record.images || []).forEach(src => {const img = document.createElement('img');img.src = src;img.alt = record.title;card.appendChild(img);});
      archiveList.appendChild(card); });
    if (records.length === 0) {archiveList.textContent = '2026 年还没有旅行记录。';}} 
  catch (error) {archiveList.textContent = '旅行记录加载失败，请检查 JSON 文件。';console.error(error);}}
    window.addEventListener('hashchange', updatePage);
    updatePage();
  </script>
</body>
</html>
