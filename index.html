
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ann's Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f5f2;

    }
    h1 { text-align: center; }
    .card {

      border-radius: 15px;
      padding: 25px;

<body>
  <h1>Shopping list</h1>
  <p style="text-align:center">
    记录我买过的好东西
  </p>

<img src="images/headphones.jpg"
     alt="我的耳机"
     style="width:100%; border-radius:12px;">

  <div class="card">
    <h2>我的第一件商品</h2>
    <p>分类：生活用品</p>
    <p>价格：¥3,000</p>
    <p>购买心得：这是我的第一条记录！</p>
    <a href="https://example.com" target="_blank">
      查看商品链接
    </a>

</html>
