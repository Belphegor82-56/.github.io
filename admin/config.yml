backend:
  name: turbo-github
  turbo_site_id: "991ec751-85e3-4211-85c2-713fc21abf11"
  branch: main

media_folder: "images/uploads"
public_folder: "/.github.io/images/uploads"

collections:
  - name: "travel"
    label: "旅行日记（公开发布）"
    files:
      - name: "travel_2026"
        label: "2026 年旅行日记"
        file: "data/public-archive-2026.json"
        format: "json"
        fields:
          - label: "旅行记录"
            name: "entries"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "标题", name: "title", widget: "string"}
              - {label: "正文", name: "body", widget: "text", required: false}
              - label: "旅行照片"
                name: "images"
                widget: "list"
                required: false
                field: {label: "照片", name: "image", widget: "image"}
